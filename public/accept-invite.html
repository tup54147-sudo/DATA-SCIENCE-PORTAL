<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accept Staff Invite | Data Science</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:wght@700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="auth-style.css"></head><body><main class="auth-wrap"><section class="auth-card"><img src="logo.jpg" class="auth-logo" alt="Department logo"><h1>Set Up Staff Account</h1><p class="auth-sub">Enter the one-time invitation code supplied by the HOD and choose a password.</p><div id="message" class="auth-message"></div><form id="inviteForm"><label for="inviteCode">Invitation Code</label><div class="input-group"><i class="fas fa-key"></i><input id="inviteCode" required></div><label for="password">New Password</label><div class="input-group password-wrap"><i class="fas fa-lock"></i><input type="password" id="password" minlength="6" required><button type="button" class="password-toggle" id="togglePassword"><i class="fas fa-eye"></i></button></div><button type="submit"><i class="fas fa-user-check"></i> Create Staff Account</button></form><p class="auth-footer"><a href="admin-login.html">Return to staff login</a></p></section></main><script type="module">import{api,showMessage,setupPasswordToggle}from'./api.js';setupPasswordToggle('password','togglePassword');const form=document.getElementById('inviteForm'),message=document.getElementById('message'),inviteCodeInput=document.getElementById('inviteCode'),passwordInput=document.getElementById('password');form.addEventListener('submit',async e=>{e.preventDefault();try{const data=await api('/api/auth/admin/accept-invite',{method:'POST',body:JSON.stringify({inviteCode:inviteCodeInput.value,password:passwordInput.value})});showMessage(message,`<i class="fas fa-check-circle"></i> ${data.message}`,'success');form.reset();}catch(error){showMessage(message,`<i class="fas fa-exclamation-circle"></i> ${error.message}`,'error');}});</script></body></html>
