<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Login | Data Science</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:wght@700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="auth-style.css"></head><body><main class="auth-wrap"><section class="auth-card"><img src="logo.jpg" class="auth-logo" alt="Department logo"><h1>Staff Login</h1><p class="auth-sub">Use your staff login code or email address and password.</p><div id="message" class="auth-message"></div><form id="adminForm"><label for="identifier">Staff Code or Email</label><div class="input-group"><i class="fas fa-user-shield"></i><input id="identifier" autocomplete="username" required></div><label for="password">Password</label><div class="input-group password-wrap"><i class="fas fa-lock"></i><input type="password" id="password" autocomplete="current-password" required><button type="button" class="password-toggle" id="togglePassword"><i class="fas fa-eye"></i></button></div><button type="submit"><i class="fas fa-sign-in-alt"></i> Open Admin Dashboard</button></form><p class="auth-footer"><a href="accept-invite.html">Set up invited lecturer account</a> · <a href="learning-area-access.html">Back</a></p></section></main><script type="module">import{api,showMessage,setupPasswordToggle}from'./api.js';setupPasswordToggle('password','togglePassword');const form=document.getElementById('adminForm'),message=document.getElementById('message'),identifierInput=document.getElementById('identifier'),passwordInput=document.getElementById('password');form.addEventListener('submit',async e=>{e.preventDefault();const button=form.querySelector('button[type=submit]');button.disabled=true;showMessage(message,'<i class="fas fa-spinner fa-spin"></i> Verifying staff account…','loading');try{const data=await api('/api/auth/admin/login',{method:'POST',body:JSON.stringify({identifier:identifierInput.value,password:passwordInput.value})});location.href=data.redirect;}catch(error){showMessage(message,`<i class="fas fa-exclamation-circle"></i> ${error.message}`,'error');button.disabled=false;}});</script></body></html>
